services:
    app:
        build: .
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        env_file:
            - .env
        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 30s
        networks:
            - appnet

    nginx:
        image: nginx:1.23-alpine
        restart: unless-stopped
        ports:
            - "8093:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            app:
                condition: service_healthy
        networks:
            - appnet

networks:
    appnet:
        driver: bridge
